[build-system]
requires = ["hatchling>=1.27"]  # 1.27: PEP 639 license metadata
build-backend = "hatchling.build"

[project]
name = "log-tracer"
dynamic = ["version"]
description = "Local, offline CLI that analyzes log files and reports recurring problems with deterministic rules."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Carlo Baratta" }]
keywords = ["logs", "log-analysis", "cli", "diagnostics", "observability", "offline"]
requires-python = ">=3.12"
# Minimums verified with the whole test suite: older typer releases break with
# click 8.2+ (make_metavar), which they do not exclude.
dependencies = [
    "typer>=0.16",
    "rich>=13.7",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Logging",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/carlobaratta/log-tracer"
Documentation = "https://github.com/carlobaratta/log-tracer/blob/main/docs/demo.md"
Changelog = "https://github.com/carlobaratta/log-tracer/blob/main/CHANGELOG.md"
Issues = "https://github.com/carlobaratta/log-tracer/issues"

[project.scripts]
log-tracer = "log_tracer.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[tool.hatch.version]
path = "src/log_tracer/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/log_tracer"]

# An explicit list: a local build must not pick up untracked files, such as the
# state of editor or assistant tools in the working tree.
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/examples",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/SPEC.md",
    "/ARCHITECTURE.md",
    "/uv.lock",
    "/.gitattributes",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "N",       # pep8-naming
    "B",       # flake8-bugbear
    "BLE",     # no blind `except Exception`
    "C4",      # comprehensions
    "PTH",     # prefer pathlib
    "PT",      # pytest style
    "RET",     # return statements
    "SIM",     # simplifications
    "UP",      # pyupgrade
    "RUF",     # ruff-specific
    "PLE2502", # bidirectional control characters in source ("Trojan Source")
]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = ["slow: tests on large generated inputs"]

[tool.coverage.run]
branch = true
source = ["log_tracer"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "assert_never\\("]
